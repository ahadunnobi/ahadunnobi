<svg width="850" height="450" viewBox="0 0 850 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with subtle glow -->
  <rect x="2" y="2" width="846" height="446" rx="12" fill="#020008" stroke="#00f5d4" stroke-width="1"/>
  <rect x="6" y="6" width="838" height="438" rx="10" fill="#020008" stroke="#00f5d4" stroke-opacity="0.1" stroke-width="4"/>

  <!-- Circuit Background Elements -->
  <path d="M780 0V40L850 110" stroke="#00f5d4" stroke-opacity="0.15" stroke-width="2"/>
  <path d="M0 380L70 450H120" stroke="#00f5d4" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Header Section -->
  <rect x="2" y="2" width="846" height="70" rx="12" fill="#00f5d4" fill-opacity="0.05"/>
  <path d="M0 72H850" stroke="#00f5d4" stroke-opacity="0.3"/>
  <text x="425" y="45" text-anchor="middle" fill="#00f5d4" font-family="monospace" font-size="24" font-weight="900" style="letter-spacing: 12px; filter: drop-shadow(0 0 5px #00f5d4);">◈ IDENTITY MATRIX ◈</text>
  
  <!-- Data Fields -->
  <g font-family="'Fira Code', monospace" font-size="17">
    <!-- Field 1 -->
    <text x="60" y="125" fill="#00f5d4" font-weight="bold">UNIT</text>
    <text x="240" y="125" fill="#ffffff">Ahadun Nobi</text>
    <path d="M60 140H790" stroke="#00f5d4" stroke-opacity="0.1"/>

    <!-- Field 2 -->
    <text x="60" y="165" fill="#00f5d4" font-weight="bold">CLASS</text>
    <text x="240" y="165" fill="#ffffff">Full-Stack Engineer × Philosophy Architect</text>
    <path d="M60 180H790" stroke="#00f5d4" stroke-opacity="0.1"/>

    <!-- Field 3 -->
    <text x="60" y="205" fill="#00f5d4" font-weight="bold">ORIGIN</text>
    <text x="240" y="205" fill="#ffffff">Bangladesh 🇧🇩</text>
    <path d="M60 220H790" stroke="#00f5d4" stroke-opacity="0.1"/>

    <!-- Field 4 -->
    <text x="60" y="245" fill="#00f5d4" font-weight="bold">SCHOOL</text>
    <text x="240" y="245" fill="#ffffff" fill-opacity="0.8">Programming Hero — Full-Stack Bootcamp</text>
    <path d="M60 260H790" stroke="#00f5d4" stroke-opacity="0.1"/>

    <!-- Field 5 -->
    <text x="60" y="285" fill="#00f5d4" font-weight="bold">PROTOCOLS</text>
    <text x="240" y="285" fill="#00f5d4" fill-opacity="0.9">MERN · Next.js · Firebase · Agentic AI</text>
    <path d="M60 300H790" stroke="#00f5d4" stroke-opacity="0.1"/>

    <!-- Field 6 -->
    <text x="60" y="330" fill="#00f5d4" font-weight="bold">QUERY</text>
    <text x="240" y="330" fill="#ffffff" font-style="italic" fill-opacity="0.7">"If destiny is real, does it run on Node.js?"</text>
    <path d="M60 345H790" stroke="#00f5d4" stroke-opacity="0.1"/>

    <!-- Field 7 -->
    <text x="60" y="375" fill="#00f5d4" font-weight="bold">STATUS</text>
    <text x="240" y="375" fill="#ffffff" font-weight="bold">"Everything is good. Allah Khair" ☕</text>
    <path d="M60 390H790" stroke="#00f5d4" stroke-opacity="0.1"/>

    <!-- Field 8 -->
    <text x="60" y="420" fill="#00f5d4" font-weight="bold">SIGNATURE</text>
    <text x="240" y="420" fill="#ffffff" font-size="15" font-style="italic" fill-opacity="0.9">"Majnoon enough to change the world with a &lt;div&gt;"</text>
  </g>

  <!-- Cyber Corner Accents -->
  <path d="M20 20H70V28H28V70H20V20Z" fill="#00f5d4"/>
  <path d="M830 430H780V422H822V380H830V430Z" fill="#00f5d4"/>
  
  <!-- Scanning Line Animation Effect (Simulated) -->
  <rect x="0" y="72" width="850" height="2" fill="#00f5d4" fill-opacity="0.2">
    <animate attributeName="y" from="72" to="450" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>
