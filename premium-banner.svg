<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020202" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Hexagonal Grid Pattern -->
    <pattern id="hex_grid" width="30" height="52" patternUnits="userSpaceOnUse" patternTransform="scale(1.5)">
      <path d="M15 0L30 8.66V26L15 34.66L0 26V8.66L15 0Z" fill="none" stroke="#00ffff" stroke-opacity="0.05" stroke-width="0.5"/>
    </pattern>

    <!-- Scanning Line Animation -->
    <linearGradient id="scan_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00ffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="250" fill="url(#bg_grad)" />
  <rect width="1200" height="250" fill="url(#hex_grid)" />

  <!-- Animated Scanning Line -->
  <rect width="1200" height="40" fill="url(#scan_grad)">
    <animate attributeName="y" from="-50" to="250" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Glowing Tech Circuits -->
  <g stroke="#00ffff" stroke-width="1" stroke-opacity="0.3" filter="url(#neon_glow)">
    <!-- Top Left -->
    <path d="M50 50 L150 50 L180 80 L300 80" />
    <circle cx="50" cy="50" r="3" fill="#00ffff" />
    <!-- Bottom Right -->
    <path d="M900 170 L1020 170 L1050 200 L1150 200" />
    <circle cx="1150" cy="200" r="3" fill="#00ffff" />
    
    <!-- Vertical Data Link -->
    <path d="M100 200 L100 120 L130 90">
      <animate attributeName="stroke-dasharray" from="0, 500" to="500, 0" dur="3s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Cyber Icons -->
  <g fill="#00ffff" fill-opacity="0.1" font-family="monospace" font-size="12">
    <text x="50" y="220">&gt; INITIALIZING_SYSTEM...</text>
    <text x="50" y="235">&gt; MERN_STACK_LOADED [OK]</text>
    <text x="1000" y="30">&gt; UPTIME_99.9%</text>
  </g>

  <!-- Central Content -->
  <g text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Main Title with Glow -->
    <text x="600" y="120" fill="#ffffff" font-size="56" font-weight="900" style="letter-spacing: 8px;" filter="url(#neon_glow)">
      AHADUN NOBI
    </text>
    
    <!-- Developer Subtitle -->
    <text x="600" y="165" fill="#00ffff" font-size="20" font-weight="600" style="letter-spacing: 4px;">
      MERN STACK DEVELOPER
    </text>
    
    <!-- Philosophy Subtitle -->
    <text x="600" y="195" fill="#ffffff" fill-opacity="0.7" font-size="18" font-style="italic" font-weight="300">
      Philosophy Enthusiast &amp; Digital Architect
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="450" y="210" width="300" height="1" fill="#00ffff" fill-opacity="0.8">
    <animate attributeName="width" from="0" to="300" dur="2s" fill="freeze" />
  </rect>
</svg>
